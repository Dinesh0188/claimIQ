# headless stops Streamlit's first-run "enter your email" prompt, which otherwise
# blocks the very first launch and kills start.ps1 outright. The script opens the
# browser itself instead.
[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0d7a6f"
backgroundColor = "#f7f9fb"
textColor = "#0f1c2e"
